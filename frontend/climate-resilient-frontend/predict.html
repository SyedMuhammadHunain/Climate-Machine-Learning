<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Infinite Field — Crop Yield Prediction & Drought Advisory</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/infinite_field_favicon.png">

    <style>
        @font-face {
            font-family: 'Whitney SSm';
            src: url('assets/fonts/WhitneySSm-Book_Web.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Whitney SSm';
            src: url('assets/fonts/WhitneySSm-Medium_Web.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }

        @font-face {
            font-family: 'Whitney SSm';
            src: url('assets/fonts/WhitneySSm-Semibold_Web.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
        }

        :root {
            --fontFamily: "Whitney SSm", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --colorPrimary600: #FF7344;
            --colorPrimary900: #232323;
            --colorNeutral800: #373e4d;
            --colorNeutral700: #545b6d;
            --colorNeutral600: #7d8699;
            --colorNeutral400: #c2c7d1;
            --colorNeutral300: #d7dae0;
            --colorNeutral200: #e5e6e8;
            --colorNeutral100: #f7f8fa;
            --widthMaxJobBoard: 720px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--fontFamily);
        }

        body {
            background-color: #ffffff;
            color: var(--colorPrimary900);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: 80px;
        }

        .header-logo-container {
            text-align: center;
            padding-top: 52px;
            padding-bottom: 48px;
        }

        .header-logo-container svg {
            height: 38px;
            width: auto;
            display: inline-block;
        }

        .job-board-container {
            max-width: var(--widthMaxJobBoard);
            margin: 0 auto;
            padding: 0 20px;
        }

        .board-heading {
            font-size: 20px;
            font-weight: 600;
            color: var(--colorPrimary900);
            line-height: 1.4;
            margin-bottom: 20px;
        }

        /* Preset Scenarios */
        .presets-bar {
            margin-bottom: 24px;
        }

        .presets-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--colorNeutral600);
            margin-bottom: 8px;
            display: block;
        }

        .presets-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preset-pill {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 20px;
            border: 1px solid var(--colorNeutral300);
            background: #ffffff;
            color: var(--colorNeutral800);
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }

        .preset-pill:hover {
            border-color: var(--colorPrimary600);
            color: var(--colorPrimary600);
        }

        .preset-pill.active {
            border-color: var(--colorPrimary600);
            background-color: #fff7f4;
            color: var(--colorPrimary600);
            font-weight: 600;
        }

        /* Form Grid */
        .form-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--colorPrimary900);
            margin-bottom: 12px;
            display: block;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .inputs-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--colorNeutral600);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .text-input,
        .select-input {
            width: 100%;
            height: 40px;
            padding: 0 14px;
            background-color: #ffffff;
            border: 1px solid var(--colorNeutral300);
            border-radius: 8px;
            font-size: 14px;
            color: var(--colorNeutral800);
            outline: none;
            transition: border-color 0.15s ease;
        }

        .select-input {
            padding-right: 32px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
        }

        .text-input:hover,
        .select-input:hover {
            border-color: #b5bac5;
        }

        .text-input:focus,
        .select-input:focus {
            border-color: var(--colorPrimary600);
        }

        .select-chevron {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            width: 12px;
            height: 12px;
        }

        /* Submit Action Row */
        .form-actions-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .btn-submit {
            height: 42px;
            padding: 0 28px;
            background-color: var(--colorPrimary900);
            color: #ffffff;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--colorPrimary600);
            box-shadow: 0 4px 12px rgba(255, 115, 68, 0.25);
        }

        .btn-reset {
            height: 42px;
            padding: 0 20px;
            background: transparent;
            border: 1px solid var(--colorNeutral300);
            border-radius: 25px;
            font-size: 13px;
            font-weight: 500;
            color: var(--colorNeutral600);
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
        }

        .btn-reset:hover {
            color: var(--colorPrimary900);
            border-color: var(--colorNeutral400);
        }

        .validation-alert {
            display: none;
            padding: 10px 16px;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-size: 13px;
            color: #b91c1c;
            margin-bottom: 16px;
            align-items: center;
            gap: 8px;
        }

        .loading-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--colorNeutral600);
            margin-top: 12px;
        }

        .loading-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--colorNeutral300);
            border-top-color: var(--colorPrimary600);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Advanced Accordion Toggle */
        .advanced-toggle-btn {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--colorNeutral600);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            padding: 0;
            outline: none;
            transition: color 0.15s ease;
        }

        .advanced-toggle-btn:hover {
            color: var(--colorPrimary600);
        }

        .advanced-chevron {
            width: 12px;
            height: 12px;
            transition: transform 0.2s ease;
        }

        .advanced-chevron.open {
            transform: rotate(180deg);
        }

        .advanced-panel {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
            padding: 20px;
            background-color: #fafbfc;
            border: 1px solid var(--colorNeutral200);
            border-radius: 8px;
        }

        .advanced-panel.open {
            display: grid;
        }

        @media (max-width: 600px) {
            .advanced-panel {
                grid-template-columns: 1fr;
            }
        }

        /* Category Titles and Results */
        .team-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--colorPrimary900);
            line-height: 1.4;
            margin-top: 36px;
            margin-bottom: 16px;
        }

        .job-post-item {
            margin-bottom: 24px;
            cursor: pointer;
        }

        .job-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--colorPrimary600);
            line-height: 1.4;
            margin-bottom: 4px;
            text-decoration: none;
            display: inline-block;
        }

        .job-title:hover {
            text-decoration: underline;
        }

        .job-metadata {
            font-size: 14px;
            color: var(--colorNeutral600);
            line-height: 1.4;
        }

        .bottom-divider {
            border-top: 1px solid var(--colorNeutral200);
            margin-top: 64px;
        }

        /* Advisory Summary Card */
        .advisory-summary {
            background-color: #f7f8fa;
            border: 1px solid var(--colorNeutral200);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 14px;
            color: var(--colorNeutral800);
            line-height: 1.5;
            margin-top: 36px;
        }

        .advisory-summary strong {
            color: var(--colorPrimary900);
            font-weight: 600;
        }
    </style>
</head>

    <div class="job-board-container">

        <!-- Heading -->
        <h1 class="board-heading">Crop Yield Prediction & Drought Advisory</h1>

        <!-- One-Click Preset Scenarios Bar -->
        <div class="presets-bar">
            <span class="presets-label">Preset Climate Scenarios:</span>
            <div class="presets-pills">
                <button type="button" class="preset-pill active" onclick="applyPreset('severe')">Severe Drought (&lt; 5 mm)</button>
                <button type="button" class="preset-pill" onclick="applyPreset('moderate')">Moderate Drought (15 mm)</button>
                <button type="button" class="preset-pill" onclick="applyPreset('baseline')">Baseline Normal (45 mm)</button>
                <button type="button" class="preset-pill" onclick="applyPreset('heatwave')">Extreme Heatwave (42°C)</button>
            </div>
        </div>

        <!-- Core Agricultural & Environmental Inputs Grid -->
        <div class="inputs-container">
            <span class="form-section-title">Core Agricultural & Climate Parameters:</span>
            <div class="inputs-grid">

                <!-- 1. Province -->
                <div class="input-group">
                    <label class="input-label" for="field-province">Province</label>
                    <div class="input-wrapper">
                        <select id="field-province" class="select-input">
                            <option value="Punjab" selected>Punjab</option>
                            <option value="Sindh">Sindh</option>
                            <option value="Balochistan">Balochistan</option>
                        </select>
                        <svg class="select-chevron" viewBox="0 0 12 12" fill="none">
                            <path d="M2.5 4.5L6 8L9.5 4.5" stroke="#7d8699" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>

                <!-- 2. Target Crop -->
                <div class="input-group">
                    <label class="input-label" for="field-crop">Target Crop Selection</label>
                    <div class="input-wrapper">
                        <select id="field-crop" class="select-input">
                            <option value="ALL" selected>All Crops (Ranked Recommendation)</option>
                            <option value="wheat">Wheat</option>
                            <option value="onion">Onion (Low Water)</option>
                            <option value="pomegranate">Pomegranate (Low Water)</option>
                            <option value="dates">Dates (Low Water)</option>
                            <option value="grapes">Grapes (Low Water)</option>
                            <option value="potato">Potato</option>
                            <option value="tomato">Tomato</option>
                            <option value="mango">Mango</option>
                            <option value="apple">Apple</option>
                            <option value="cotton">Cotton (High Water)</option>
                            <option value="rice">Rice (High Water)</option>
                            <option value="sugarcane">Sugarcane (High Water)</option>
                            <option value="banana">Banana (High Water)</option>
                        </select>
                        <svg class="select-chevron" viewBox="0 0 12 12" fill="none">
                            <path d="M2.5 4.5L6 8L9.5 4.5" stroke="#7d8699" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>

                <!-- 3. Cultivated Area -->
                <div class="input-group">
                    <label class="input-label" for="field-area">Cultivated Area (hectares)</label>
                    <div class="input-wrapper">
                        <input type="number" id="field-area" class="text-input" min="0.1" max="20000" step="0.5" value="50.0" placeholder="e.g. 50.0">
                    </div>
                </div>

                <!-- 4. Seasonal Precipitation -->
                <div class="input-group">
                    <label class="input-label" for="field-precipitation">Seasonal Precipitation (mm)</label>
                    <div class="input-wrapper">
                        <input type="number" id="field-precipitation" class="text-input" min="0.0" max="600.0" step="0.5" value="3.5" placeholder="e.g. 3.5">
                    </div>
                </div>

                <!-- 5. Mean Temperature -->
                <div class="input-group">
                    <label class="input-label" for="field-temperature">Mean Seasonal Temperature (°C)</label>
                    <div class="input-wrapper">
                        <input type="number" id="field-temperature" class="text-input" min="-5.0" max="55.0" step="0.5" value="33.0" placeholder="e.g. 33.0">
                    </div>
                </div>

            </div>

            <!-- Advanced Collapsible Toggle Button -->
            <button type="button" class="advanced-toggle-btn" id="toggle-advanced-btn" onclick="toggleAdvancedPanel()">
                <span>Advanced Meteorological Parameters (6 features)</span>
                <svg class="advanced-chevron" id="advanced-chevron" viewBox="0 0 12 12" fill="none">
                    <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- Collapsible Panel with 6 Secondary Features -->
            <div class="advanced-panel" id="advanced-panel">

                <!-- 1. Maximum Temperature -->
                <div class="input-group">
                    <label class="input-label" for="field-temp-max">Maximum Temperature (°C)</label>
                    <div class="input-wrapper">
                        <input type="number" id="field-temp-max" class="text-input" min="-5.0" max="60.0" step="0.5" value="39.5" placeholder="e.g. 39.5">
                    </div>
                </div>

                <!-- 2. Minimum Temperature -->
                <div class="input-group">
                    <label class="input-label" for="field-temp-min">Minimum Temperature (°C)</label>
                    <div class="input-wrapper">
                        <input type="number" id="field-temp-min" class="text-input" min="-10.0" max="45.0" step="0.5" value="26.0" placeholder="e.g. 26.0">
                    </div>
                </div>

                <!-- 3. FAO Reference Evapotranspiration -->
                <div class="input-group">
                    <label class="input-label" for="field-et0">FAO Evapotranspiration (mm/day)</label>
                    <div class="input-wrapper">
                        <input type="number" id="field-et0" class="text-input" min="0.5" max="20.0" step="0.1" value="7.8" placeholder="e.g. 7.8">
                    </div>
                </div>

                <!-- 4. Solar Radiation -->
                <div class="input-group">
                    <label class="input-label" for="field-radiation">Solar Radiation (MJ/m²)</label>
                    <div class="input-wrapper">
                        <input type="number" id="field-radiation" class="text-input" min="5.0" max="40.0" step="0.5" value="25.5" placeholder="e.g. 25.5">
                    </div>
                </div>

                <!-- 5. Precipitation Hours -->
                <div class="input-group">
                    <label class="input-label" for="field-precip-hours">Precipitation Hours (hours)</label>
                    <div class="input-wrapper">
                        <input type="number" id="field-precip-hours" class="text-input" min="0.0" max="500.0" step="0.5" value="1.0" placeholder="e.g. 1.0">
                    </div>
                </div>

                <!-- 6. Climate Dryness Index -->
                <div class="input-group">
                    <label class="input-label" for="field-climate-index">Climate Dryness Index (0.0 - 1.0)</label>
                    <div class="input-wrapper">
                        <input type="number" id="field-climate-index" class="text-input" min="0.0" max="1.0" step="0.01" value="0.92" placeholder="e.g. 0.92">
                    </div>
                </div>

            </div>

            <!-- Validation Alert Box -->
            <div id="validation-alert" class="validation-alert">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="validation-msg">Validation error message</span>
            </div>

            <!-- Primary Action Buttons Row -->
            <div class="form-actions-row">
                <button type="button" class="btn-submit" id="btn-submit-prediction" onclick="submitPredictionForm()">
                    <span>Run Crop Yield Prediction</span>
                </button>
                <button type="button" class="btn-reset" onclick="resetFormToDefaults()">
                    Reset
                </button>
            </div>

            <!-- Loading Spinner State -->
            <div id="loading-indicator" class="loading-indicator">
                <div class="loading-spinner"></div>
                <span>Executing machine learning pipeline inference...</span>
            </div>
        </div>

        <!-- Results Container (Hidden on initial load until prediction runs) -->
        <div id="results-container" style="display: none; margin-top: 24px;">

            <!-- Real-Time Inference Status & Verification Badge Row -->
            <div class="inference-status-row" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--colorNeutral200);">
                <div class="status-pill" id="inference-status-pill" style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--colorNeutral800); background-color: #f7f8fa; border: 1px solid var(--colorNeutral200); padding: 4px 12px; border-radius: 14px;">
                    <span class="status-dot" id="status-dot" style="width: 7px; height: 7px; border-radius: 50%; background-color: #10b981;"></span>
                    <span id="status-badge-text">Inference completed • Updated just now</span>
                </div>
                <span id="inference-timestamp" style="font-size: 12px; color: var(--colorNeutral600);"></span>
            </div>

            <!-- Single Crop Projection Section (Visible in Single Crop Mode) -->
            <div class="team-section" id="single-crop-section" style="display: none;">
                <h2 class="team-title" id="single-crop-title">Yield Forecast</h2>
                <div id="single-crop-items">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Multi-Crop Category 1: Drought-Resilient Recommendations -->
            <div class="team-section" id="team-section-1">
                <h2 class="team-title" id="team-title-1">Drought-Resilient Recommendations</h2>
                <div id="team-items-1">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Multi-Crop Category 2: Water-Intensive Warnings -->
            <div class="team-section" id="team-section-2">
                <h2 class="team-title" id="team-title-2">Water-Intensive Warnings</h2>
                <div id="team-items-2">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Agronomic Advisory Narrative -->
            <div class="advisory-summary" id="advisory-summary">
                <!-- Populated dynamically -->
            </div>

        </div>

        <!-- Faint bottom divider matching Ashby -->
        <div class="bottom-divider"></div>

    </div>

    <script>
        const API_BASE = window.API_BASE || "http://127.0.0.1:8000";

        const PRESET_CONFIGS = {
            severe: {
                precip: 3.5,
                temp: 34.0,
                area: 50.0,
                temp_max: 39.5,
                temp_min: 26.0,
                et0: 7.8,
                radiation: 25.5,
                precip_hours: 1.0,
                climate_index: 0.92
            },
            moderate: {
                precip: 15.0,
                temp: 31.5,
                area: 50.0,
                temp_max: 36.0,
                temp_min: 23.5,
                et0: 6.2,
                radiation: 22.0,
                precip_hours: 5.0,
                climate_index: 0.75
            },
            baseline: {
                precip: 45.0,
                temp: 27.5,
                area: 50.0,
                temp_max: 32.0,
                temp_min: 20.0,
                et0: 4.8,
                radiation: 18.5,
                precip_hours: 18.0,
                climate_index: 0.45
            },
            heatwave: {
                precip: 1.0,
                temp: 42.0,
                area: 50.0,
                temp_max: 46.5,
                temp_min: 31.0,
                et0: 9.5,
                radiation: 28.0,
                precip_hours: 0.5,
                climate_index: 0.98
            }
        };

        function toggleAdvancedPanel() {
            const panel = document.getElementById("advanced-panel");
            const chevron = document.getElementById("advanced-chevron");
            const isOpen = panel.classList.toggle("open");
            chevron.classList.toggle("open", isOpen);
        }

        function applyPreset(key) {
            const config = PRESET_CONFIGS[key];
            if (!config) return;

            document.getElementById("field-precipitation").value = config.precip;
            document.getElementById("field-temperature").value = config.temp;
            document.getElementById("field-area").value = config.area;

            // Update advanced fields if present
            if (document.getElementById("field-temp-max")) {
                document.getElementById("field-temp-max").value = config.temp_max;
                document.getElementById("field-temp-min").value = config.temp_min;
                document.getElementById("field-et0").value = config.et0;
                document.getElementById("field-radiation").value = config.radiation;
                document.getElementById("field-precip-hours").value = config.precip_hours;
                document.getElementById("field-climate-index").value = config.climate_index;
            }

            document.querySelectorAll(".preset-pill").forEach(el => el.classList.remove("active"));
            if (event && event.target) {
                event.target.classList.add("active");
            }
        }

        function showValidationError(message) {
            const alertBox = document.getElementById("validation-alert");
            const msgEl = document.getElementById("validation-msg");
            msgEl.textContent = message;
            alertBox.style.display = "flex";
        }

        function clearValidationError() {
            const alertBox = document.getElementById("validation-alert");
            alertBox.style.display = "none";
        }

        function resetFormToDefaults() {
            clearValidationError();
            applyPreset('severe');
            document.getElementById("field-province").value = "Punjab";
            document.getElementById("field-crop").value = "ALL";
            const results = document.getElementById("results-container");
            if (results) results.style.display = "none";
            const heading = document.querySelector(".board-heading");
            if (heading) heading.textContent = "Crop Yield Prediction & Drought Advisory";
        }

        async function submitPredictionForm() {
            clearValidationError();

            const province = document.getElementById("field-province").value;
            const crop = document.getElementById("field-crop").value;
            const area = parseFloat(document.getElementById("field-area").value);
            const precip = parseFloat(document.getElementById("field-precipitation").value);
            const temp = parseFloat(document.getElementById("field-temperature").value);
            const temp_max = parseFloat(document.getElementById("field-temp-max").value);
            const temp_min = parseFloat(document.getElementById("field-temp-min").value);
            const et0 = parseFloat(document.getElementById("field-et0").value);
            const radiation = parseFloat(document.getElementById("field-radiation").value);
            const precip_hours = parseFloat(document.getElementById("field-precip-hours").value);
            const climate_index = parseFloat(document.getElementById("field-climate-index").value);

            // Client-side Physical Agronomic Validation
            if (isNaN(area) || area < 0.1 || area > 20000.0) {
                showValidationError("Cultivated area must be between 0.1 and 20,000 hectares.");
                return;
            }

            if (isNaN(precip) || precip < 0.0 || precip > 600.0) {
                showValidationError("Seasonal precipitation must be between 0 and 600 mm.");
                return;
            }

            if (isNaN(temp) || temp < -5.0 || temp > 55.0) {
                showValidationError("Mean temperature must be between -5.0°C and 55.0°C.");
                return;
            }

            if (!isNaN(temp_max) && !isNaN(temp_min)) {
                if (temp_max < temp_min) {
                    showValidationError(`Maximum temperature (${temp_max}°C) cannot be lower than minimum temperature (${temp_min}°C).`);
                    return;
                }
            }

            const startTime = performance.now();
            const loadingEl = document.getElementById("loading-indicator");
            const submitBtn = document.getElementById("btn-submit-prediction");
            loadingEl.style.display = "inline-flex";
            submitBtn.disabled = true;

            try {
                const isAllCrops = crop === "ALL";
                const endpoint = isAllCrops ? `${API_BASE}/api/v1/recommend` : `${API_BASE}/api/v1/predict`;

                const payload = isAllCrops ? {
                    province: province,
                    area: area,
                    precipitation_sum: precip,
                    temperature_2m_mean: temp,
                    temperature_2m_max: temp_max,
                    temperature_2m_min: temp_min,
                    fao_evapotranspiration: et0,
                    shortwave_radiation: radiation,
                    precipitation_hours: precip_hours,
                    climate_index: climate_index,
                    scenario_name: `Agroclimatic Simulation (${province})`
                } : {
                    province: province,
                    crop: crop.toLowerCase(),
                    area: area,
                    precipitation_sum: precip,
                    temperature_2m_mean: temp,
                    temperature_2m_max: temp_max,
                    temperature_2m_min: temp_min,
                    fao_evapotranspiration: et0,
                    shortwave_radiation: radiation,
                    precipitation_hours: precip_hours,
                    climate_index: climate_index
                };

                // Abort request after 3.5s if backend is unreachable or hanging
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);

                let resultData = null;
                let isLiveApi = false;

                try {
                    const response = await fetch(endpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        resultData = await response.json();
                        isLiveApi = true;
                    } else {
                        const err = await response.json();
                        showValidationError(err.detail || "API rejected input parameters.");
                    }
                } catch (networkErr) {
                    clearTimeout(timeoutId);
                    console.warn("Backend API request failed or timed out. Running local agronomic fallback simulation.", networkErr);
                }

                // Minimum 350ms loading duration for tactile feedback
                const elapsed = performance.now() - startTime;
                if (elapsed < 350) {
                    await new Promise(r => setTimeout(r, 350 - elapsed));
                }

                if (resultData && isLiveApi) {
                    if (window.renderModelResults) {
                        window.renderModelResults(resultData, isAllCrops);
                    }
                } else if (!document.getElementById("validation-alert").offsetParent) {
                    // Fallback simulation when live API not reached and no validation error
                    if (window.renderFallbackSimulation) {
                        window.renderFallbackSimulation(payload, isAllCrops);
                    }
                }

                // Smooth scroll to results
                const resultsContainer = document.getElementById("results-container");
                if (resultsContainer && resultsContainer.style.display !== "none") {
                    resultsContainer.scrollIntoView({ behavior: "smooth", block: "start" });
                }
            } catch (unexpectedErr) {
                console.error("Unexpected error in prediction pipeline:", unexpectedErr);
                showValidationError("An unexpected error occurred while executing inference.");
            } finally {
                loadingEl.style.display = "none";
                submitBtn.disabled = false;
            }
        }

        window.renderModelResults = function(data, isAllCrops) {
            const resultsContainer = document.getElementById("results-container");
            if (resultsContainer) resultsContainer.style.display = "block";

            const statusDot = document.getElementById("status-dot");
            const badgeText = document.getElementById("status-badge-text");
            const timeText = document.getElementById("inference-timestamp");
            const now = new Date().toLocaleTimeString();
            if (statusDot) statusDot.style.backgroundColor = "#10b981";
            if (badgeText) badgeText.textContent = "Live ML Model Pipeline (FastAPI / Scikit-Learn)";
            if (timeText) timeText.textContent = `Updated at ${now}`;

            const singleSection = document.getElementById("single-crop-section");
            const resilientSection = document.getElementById("team-section-1");
            const warningsSection = document.getElementById("team-section-2");
            const advisorySummary = document.getElementById("advisory-summary");
            const boardHeading = document.querySelector(".board-heading");

            if (isAllCrops) {
                singleSection.style.display = "none";
                resilientSection.style.display = "block";
                warningsSection.style.display = "block";

                const count = (data.ranked_drought_resilient || []).length + (data.water_intensive_warnings || []).length;
                boardHeading.textContent = `Drought-Resilient Crop Advisory (${count})`;

                let resHtml = "";
                (data.ranked_drought_resilient || []).forEach(item => {
                    const yieldKg = Math.round(item.predicted_yield_kg_ha).toLocaleString();
                    resHtml += `
                        <div class="job-post-item" onclick="alert('${item.crop}: Predicted Yield ${yieldKg} kg/ha. Water category: ${item.water_category}. ${item.risk_assessment}')">
                            <a href="javascript:void(0)" class="job-title">${item.crop}</a>
                            <div class="job-metadata">Rank #${item.rank} • Predicted Yield: ${yieldKg} kg/ha • Water Category: ${item.water_category} • ${item.risk_assessment}</div>
                        </div>
                    `;
                });
                document.getElementById("team-items-1").innerHTML = resHtml;

                let warnHtml = "";
                (data.water_intensive_warnings || []).forEach(item => {
                    const yieldKg = Math.round(item.predicted_yield_kg_ha).toLocaleString();
                    warnHtml += `
                        <div class="job-post-item" onclick="alert('${item.crop}: Critical Water Deficit! ${item.warning}')">
                            <a href="javascript:void(0)" class="job-title">${item.crop}</a>
                            <div class="job-metadata">High Water Demand • Predicted Yield: ${yieldKg} kg/ha • ${item.warning}</div>
                        </div>
                    `;
                });
                document.getElementById("team-items-2").innerHTML = warnHtml;

                advisorySummary.innerHTML = `<strong>Agronomic Advisory (${data.scenario_name || data.province}):</strong> ${data.recommendation_summary}`;
            } else {
                singleSection.style.display = "block";
                resilientSection.style.display = "none";
                warningsSection.style.display = "none";

                const cropDisplay = data.crop.charAt(0).toUpperCase() + data.crop.slice(1);
                boardHeading.textContent = `Crop Yield Forecast: ${cropDisplay}`;
                const yieldKg = Math.round(data.predicted_yield_kg_ha).toLocaleString();
                const totalMetricTons = Math.round((data.predicted_yield_kg_ha * (data.features_used?.Area || 50)) / 1000).toLocaleString();

                document.getElementById("single-crop-items").innerHTML = `
                    <div class="job-post-item">
                        <a href="javascript:void(0)" class="job-title">${cropDisplay} (${data.province})</a>
                        <div class="job-metadata">Predicted Yield: ${yieldKg} kg/ha • Water Category: ${data.water_category} • Drought Resilient: ${data.is_drought_resilient ? 'YES' : 'NO'}</div>
                        <div class="job-metadata" style="margin-top: 4px; color: var(--colorNeutral800);">Total Expected Production: ${totalMetricTons} metric tons across ${data.features_used?.Area || 50} hectares</div>
                    </div>
                `;

                advisorySummary.innerHTML = `<strong>Prediction Risk Assessment:</strong> ${data.risk_assessment}`;
            }
        };

        window.renderFallbackSimulation = function(payload, isAllCrops) {
            const resultsContainer = document.getElementById("results-container");
            if (resultsContainer) resultsContainer.style.display = "block";

            const statusDot = document.getElementById("status-dot");
            const badgeText = document.getElementById("status-badge-text");
            const timeText = document.getElementById("inference-timestamp");
            const now = new Date().toLocaleTimeString();
            if (statusDot) statusDot.style.backgroundColor = "#f59e0b";
            if (badgeText) badgeText.textContent = "Agronomic Simulation Engine (Regional Fallback)";
            if (timeText) timeText.textContent = `Calculated at ${now}`;

            const singleSection = document.getElementById("single-crop-section");
            const resilientSection = document.getElementById("team-section-1");
            const warningsSection = document.getElementById("team-section-2");
            const advisorySummary = document.getElementById("advisory-summary");
            const boardHeading = document.querySelector(".board-heading");

            const province = payload.province;
            const precip = payload.precipitation_sum;
            const temp = payload.temperature_2m_mean;
            const area = payload.area || 50;

            if (isAllCrops) {
                singleSection.style.display = "none";
                resilientSection.style.display = "block";
                warningsSection.style.display = "block";
                boardHeading.textContent = `Drought-Resilient Crop Advisory (5)`;

                const resilientCrops = [
                    { crop: "Bajra (Pearl Millet)", yield: Math.round(1750 + precip * 6 - (temp - 30) * 12), water: "Low", rank: 1, risk: "Minimal Risk under water stress" },
                    { crop: "Jowar (Sorghum)", yield: Math.round(1350 + precip * 5 - (temp - 30) * 10), water: "Low", rank: 2, risk: "Low Risk — deep root adaptation" },
                    { crop: "Gram (Chickpea)", yield: Math.round(890 + precip * 4 - (temp - 30) * 8), water: "Low", rank: 3, risk: "Moderate Risk — drought tolerant pulse" }
                ];

                const warningCrops = [
                    { crop: "Sugarcane", yield: Math.round(3800 + precip * 15), warning: "Critical Risk: Requires 1,500-2,500mm water; expected 70%+ harvest loss without canal supply." },
                    { crop: "Rice", yield: Math.round(980 + precip * 8), warning: "Severe Risk: Flooding-dependent paddy unviable under low seasonal rainfall." }
                ];

                let resHtml = "";
                resilientCrops.forEach(item => {
                    resHtml += `
                        <div class="job-post-item">
                            <a href="javascript:void(0)" class="job-title">${item.crop}</a>
                            <div class="job-metadata">Rank #${item.rank} • Predicted Yield: ${item.yield.toLocaleString()} kg/ha • Water Category: ${item.water} • ${item.risk}</div>
                        </div>
                    `;
                });
                document.getElementById("team-items-1").innerHTML = resHtml;

                let warnHtml = "";
                warningCrops.forEach(item => {
                    warnHtml += `
                        <div class="job-post-item">
                            <a href="javascript:void(0)" class="job-title">${item.crop}</a>
                            <div class="job-metadata">High Water Demand • Predicted Yield: ${item.yield.toLocaleString()} kg/ha • ${item.warning}</div>
                        </div>
                    `;
                });
                document.getElementById("team-items-2").innerHTML = warnHtml;

                advisorySummary.innerHTML = `<strong>Agronomic Advisory (${province}):</strong> At ${precip} mm rainfall and ${temp}°C, coarse grains (Bajra & Jowar) show optimal water-use efficiency. Sugarcane and Rice face catastrophic yield reductions.`;
            } else {
                singleSection.style.display = "block";
                resilientSection.style.display = "none";
                warningsSection.style.display = "none";

                const crop = payload.crop || "wheat";
                const cropDisplay = crop.charAt(0).toUpperCase() + crop.slice(1);
                boardHeading.textContent = `Crop Yield Forecast: ${cropDisplay}`;

                const isResilient = ["onion", "pomegranate", "grapes", "wheat", "dates"].includes(crop.toLowerCase());
                let estYield = 90;
                if (crop.toLowerCase() === "onion") estYield = Math.round(95 + precip * 0.5);
                else if (crop.toLowerCase() === "wheat") estYield = Math.round(88 + precip * 0.4);
                else if (crop.toLowerCase() === "sugarcane") estYield = Math.round(500 + precip * 2);
                else if (crop.toLowerCase() === "rice") estYield = Math.round(130 + precip * 0.8);
                else if (crop.toLowerCase() === "cotton") estYield = Math.round(130 + precip * 0.8);
                else estYield = Math.round(110 + precip * 0.6);

                const totalMetricTons = Math.round((estYield * area) / 1000).toLocaleString();

                document.getElementById("single-crop-items").innerHTML = `
                    <div class="job-post-item">
                        <a href="javascript:void(0)" class="job-title">${cropDisplay} (${province})</a>
                        <div class="job-metadata">Predicted Yield: ${estYield.toLocaleString()} kg/ha • Water Category: ${isResilient ? 'Low-Water Resilient' : 'High-Water Intensive'} • Drought Resilient: ${isResilient ? 'YES' : 'NO'}</div>
                        <div class="job-metadata" style="margin-top: 4px; color: var(--colorNeutral800);">Total Expected Production: ${totalMetricTons} metric tons across ${area} hectares</div>
                    </div>
                `;

                advisorySummary.innerHTML = `<strong>Prediction Summary:</strong> ${cropDisplay} in ${province} under ${precip}mm rainfall produces an estimated ${estYield.toLocaleString()} kg/ha (${isResilient ? 'drought resilient' : 'water intensive'}).`;
            }
        };

        // Auto-sync advanced temperature and evapotranspiration when primary parameters are changed
        document.getElementById("field-temperature").addEventListener("input", function(e) {
            const val = parseFloat(e.target.value);
            if (!isNaN(val)) {
                document.querySelectorAll(".preset-pill").forEach(el => el.classList.remove("active"));
                const maxEl = document.getElementById("field-temp-max");
                const minEl = document.getElementById("field-temp-min");
                if (maxEl) maxEl.value = (val + 6.0).toFixed(1);
                if (minEl) minEl.value = (val - 6.0).toFixed(1);
            }
        });

        document.getElementById("field-precipitation").addEventListener("input", function(e) {
            const val = parseFloat(e.target.value);
            if (!isNaN(val)) {
                document.querySelectorAll(".preset-pill").forEach(el => el.classList.remove("active"));
                const et0El = document.getElementById("field-et0");
                if (et0El) {
                    if (val >= 40.0) et0El.value = "4.0";
                    else if (val >= 20.0) et0El.value = "4.5";
                    else et0El.value = "7.8";
                }
            }
        });
    </script>
</body>
</html>
