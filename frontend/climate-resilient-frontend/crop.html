<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Crop details — Low-Water Crops</title>
    <meta name="description" content="One crop in detail: its rank, predicted yield and share of a typical year in a province for the scenario you chose. Every number is model output.">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/site_favicon.png">

    <style>
        @font-face {
            font-family: 'Whitney SSm';
            src: url('assets/fonts/WhitneySSm-Book_Web.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Whitney SSm';
            src: url('assets/fonts/WhitneySSm-Medium_Web.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Whitney SSm';
            src: url('assets/fonts/WhitneySSm-Semibold_Web.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --fontFamily: "Whitney SSm", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --colorPrimary600: #FF7344;
            --colorPrimary900: #232323;
            --colorNeutral800: #373e4d;
            --colorNeutral700: #545b6d;
            --colorNeutral600: #596173; /* 6.2:1 on white (was #7d8699, 3.7:1) */
            --colorNeutral400: #c2c7d1;
            --colorNeutral300: #d7dae0;
            --colorNeutral200: #e5e6e8;
            --colorNeutral100: #f7f8fa;
            --colorAccentText: #b93a0a; /* orange for text: 5.7:1 on white (--colorPrimary600 is 2.6:1, borders and fills only) */
            --gutter: clamp(16px, 4vw, 32px);
            --widthMaxJobBoard: clamp(720px, 50vw, 960px); /* 720 px up to 1440 px screens, 960 px from 1920 px */
            --fontNav: clamp(14px, 0.35vw + 11px, 16px);
            --minTarget: 44px; /* WCAG 2.5.5 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--fontFamily);
        }

        body {
            background-color: #ffffff;
            color: var(--colorPrimary900);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: 80px;
        }

        .header-logo-container {
            text-align: center;
            padding: clamp(24px, 5vw, 52px) var(--gutter) clamp(24px, 4vw, 48px);
        }

        .header-logo-container a {
            display: inline-flex !important; /* the link is the tap target: at least 44 px tall */
            align-items: center;
            justify-content: center;
            min-height: 44px;
            max-width: 100%;
        }

        .header-logo-container svg {
            width: min(100%, clamp(240px, 24vw, 420px)); /* 330 px wide on 1440 px screens, never wider than the screen */
            height: auto;
            display: inline-block;
        }

        .site-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            padding: 0 var(--gutter);
            max-width: var(--widthMaxJobBoard);
        }

        .nav-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: var(--minTarget);
            padding: 8px 16px;
            font-size: var(--fontNav);
            font-weight: 500;
            color: var(--colorNeutral700);
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid var(--colorNeutral300);
            background: #ffffff;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        @media (max-width: 479px) {
            .nav-pill {
                flex: 1 1 100%; /* stacked, one tab per row, label never cut */
            }
        }

        .nav-pill:hover {
            color: var(--colorPrimary900);
            border-color: var(--colorNeutral600);
        }

        .nav-pill.active {
            background: var(--colorPrimary900);
            color: #ffffff;
            border-color: var(--colorPrimary900);
            font-weight: 600;
        }

        .crop-main {
            max-width: var(--widthMaxJobBoard);
            margin: 0 auto;
            padding: 0 var(--gutter);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            min-height: var(--minTarget);
            font-size: 14px;
            font-weight: 500;
            color: var(--colorAccentText);
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .crop-header {
            margin: 4px 0 20px;
        }

        #crop-title {
            font-size: clamp(24px, 2vw + 16px, 32px);
            font-weight: 600;
            line-height: 1.2;
            text-transform: capitalize;
        }

        #crop-province {
            margin-top: 4px;
            font-size: 16px;
            color: var(--colorNeutral700);
        }

        .crop-error {
            padding: 14px 16px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
            color: #991b1b;
            overflow-wrap: anywhere;
        }

        .crop-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 1024px) {
            .crop-grid {
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }

            .crop-card.wide {
                grid-column: 1 / -1;
            }
        }

        .crop-card {
            padding: 18px 20px;
            background: #ffffff;
            border: 1px solid var(--colorNeutral300);
            border-radius: 8px;
            min-width: 0;
        }

        .crop-card h2 {
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        .crop-card p {
            margin-bottom: 8px;
            font-size: 14px;
            line-height: 1.5;
            color: var(--colorNeutral800);
            overflow-wrap: anywhere;
        }

        .crop-card p:last-child {
            margin-bottom: 0;
        }

        .crop-card a {
            color: var(--colorAccentText);
        }

        .crop-facts div {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 4px 16px;
            padding: 8px 0;
            border-bottom: 1px solid var(--colorNeutral200);
        }

        .crop-facts div:last-child {
            border-bottom: none;
        }

        .crop-facts dt {
            font-size: 14px;
            color: var(--colorNeutral600);
        }

        .crop-facts dd {
            font-size: 15px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .crop-facts dd em {
            font-size: 13px;
            font-weight: 400;
            font-style: normal;
            color: var(--colorNeutral600);
        }

        .crop-facts.stacked div {
            display: block;
        }

        .crop-facts.stacked dd {
            margin-top: 2px;
            text-align: left;
        }

        .crop-unit {
            margin-top: 10px;
            font-size: 13px !important;
            color: var(--colorNeutral600) !important;
        }

        .crop-table-wrapper {
            border: 1px solid var(--colorNeutral300);
            border-radius: 6px;
            overflow-x: auto;
        }

        .crop-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        .crop-table th {
            padding: 10px 12px;
            background: var(--colorNeutral100);
            border-bottom: 1px solid var(--colorNeutral300);
            font-size: 13px;
            font-weight: 600;
            vertical-align: bottom;
        }

        .crop-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--colorNeutral200);
            overflow-wrap: anywhere;
        }

        .crop-table tr:last-child td {
            border-bottom: none;
        }

        .crop-table .num {
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 599px) {
            /* one labelled card per row, like the metrics tables */
            .crop-table,
            .crop-table tbody,
            .crop-table tr,
            .crop-table td {
                display: block;
            }

            .crop-table thead {
                display: none;
            }

            .crop-table tr {
                padding: 10px 12px;
                border-bottom: 1px solid var(--colorNeutral300);
            }

            .crop-table tr:last-child {
                border-bottom: none;
            }

            .crop-table td {
                display: flex;
                justify-content: space-between;
                gap: 16px;
                padding: 4px 0;
                border-bottom: none;
                text-align: right;
            }

            .crop-table td::before {
                content: attr(data-label);
                flex: 0 1 50%;
                font-size: 13px;
                font-weight: 600;
                text-align: left;
                color: var(--colorNeutral600);
            }

            .crop-table td:first-child {
                display: block;
                padding-bottom: 6px;
                font-weight: 600;
                text-align: left;
            }

            .crop-table td:first-child::before {
                display: none;
            }
        }

        .crop-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            margin: 24px 0 8px;
        }

        .crop-nav a {
            display: inline-flex;
            align-items: center;
            min-height: var(--minTarget);
            padding: 8px 16px;
            border: 1px solid var(--colorNeutral300);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--colorPrimary900);
            text-decoration: none;
            text-transform: capitalize;
        }

        .crop-nav a:hover {
            border-color: var(--colorNeutral600);
        }

        @media (max-width: 479px) {
            .crop-nav a {
                flex: 1 1 100%;
                justify-content: center;
            }
        }
    </style>
</head>

    <script>
        const API_BASE = window.API_BASE || (window.location.origin && window.location.origin.startsWith("http") ? window.location.origin : "http://127.0.0.1:8000");
        // API text goes into innerHTML, so escape it
        const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const $ = id => document.getElementById(id);
        const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
        const pct = x => Number(x).toFixed(1);
        const yl = x => Number(x).toFixed(2);
        const fmt = x => Number(x).toLocaleString(undefined, { maximumFractionDigits: 3 });

        const INPUT_KEYS = ["precipitation_sum", "temperature_2m_mean", "temperature_2m_max", "temperature_2m_min", "fao_evapotranspiration",
            "shortwave_radiation", "precipitation_hours", "soil_wetness_mean", "soil_wetness_max"];
        const NAMES = {
            precipitation_sum: "Annual rain (mm)", temperature_2m_mean: "Mean temperature (°C)",
            temperature_2m_max: "Max temperature (°C)", temperature_2m_min: "Min temperature (°C)",
            fao_evapotranspiration: "ET0 (mm/day)", shortwave_radiation: "Radiation (MJ/m²)",
            precipitation_hours: "Rain hours", soil_wetness_mean: "Soil wetness, mean (0-1)", soil_wetness_max: "Soil wetness, max (0-1)",
        };
        const SOURCE_LABEL = {
            user: "entered", province_median_training_years: "province median",
            user_mean_plus_province_median_offset: "your mean + province median offset",
        };

        class PageError extends Error {}

        async function getJson(path, body) {
            const options = { signal: AbortSignal.timeout(30000) };
            if (body) Object.assign(options, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
            const res = await fetch(`${API_BASE}${path}`, options);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new PageError(data.message || `The model server answered ${res.status}.`);
            return data;
        }

        function showError(message) {
            $("crop-content").hidden = true;
            $("crop-error").hidden = false;
            $("crop-error").innerHTML = `${esc(message)}`;
            document.title = "Crop details — Low-Water Crops";
        }

        // crop.html?crop=rice&province=Sindh&precipitation_sum=...: the scenario travels in the address
        function cropHref(crop, province, inputs) {
            const q = new URLSearchParams({ crop, province });
            Object.entries(inputs).forEach(([k, v]) => q.set(k, v));
            return "crop.html?" + q.toString();
        }

        function groupOf(response, crop) {
            return response.groups.find(g => g.crops.includes(crop));
        }

        function rankText(response, crop) {
            const g = groupOf(response, crop);
            const others = g.crops.length - 1;
            return others === 0 ? `Rank ${g.rank}` : `Rank ${g.rank}, tied with ${others} other crop${others > 1 ? "s" : ""} at ${pct(g.pct_of_normal)}%`;
        }

        function render(crop, province, inputs, response, years) {
            const item = response.ranked_crops.find(c => c.crop === crop);
            const fao = item.fao_water_need;
            $("crop-title").textContent = crop;
            $("crop-province").textContent = province;
            document.title = `${cap(crop)} in ${province} — Low-Water Crops`;

            const card = (id, title, inner, wide = false) => `<section class="crop-card${wide ? " wide" : ""}" id="${id}-card"><h2>${esc(title)}</h2>${inner}</section>`;
            const facts = rows => rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join("");

            const yearRow = (label, resp) => {
                const it = resp.ranked_crops.find(c => c.crop === crop);
                return `<tr><td data-label="Scenario">${esc(label)}</td><td class="num" data-label="Rank">${esc(groupOf(resp, crop).rank)}</td>`
                    + `<td class="num" data-label="Share of a typical year">${pct(it.pct_of_normal)}%</td><td class="num" data-label="Predicted yield">${yl(it.predicted_yield)}</td></tr>`;
            };

            const water = fao
                ? `<p>${esc(fao.mm_min)}-${esc(fao.mm_max)} mm per growing period, drought sensitivity ${esc(fao.drought_sensitivity)}.</p>`
                  + `<p>Context only, not a model input. <a href="${esc(fao.source_url)}" target="_blank" rel="noopener">${esc(fao.fao_name)}, FAO Training Manual 3, Table 14</a></p>`
                : `<p>not listed in the FAO table</p>`;
            const incomplete = item.training_rows_for_crop < item.training_rows_possible ? " (incomplete data for this crop)" : "";
            const barely = item.barely_grown
                ? `<p>Barely grown here: the model's typical yield for this crop in ${esc(province)} is a tiny fraction of the largest crop's, so its share of a typical year says little.</p>` : "";

            $("crop-grid").innerHTML = [
                card("crop-result", "Result", `<dl id="crop-result" class="crop-facts">${facts([
                    ["Rank", esc(rankText(response, crop))],
                    ["Predicted yield", yl(item.predicted_yield)],
                    ["Typical year yield", yl(item.normal_yield)],
                    ["Share of a typical year", `${pct(item.pct_of_normal)}%`],
                ])}</dl><p class="crop-unit">Yield unit: ${esc(response.yield_unit)}.</p>`),
                card("crop-water", "Water need", `<div id="crop-water">${water}</div>`),
                card("crop-years", "Across real years",
                    `<div class="crop-table-wrapper"><table class="crop-table" id="crop-years"><thead><tr><th>Scenario</th><th class="num">Rank</th><th class="num">Share of a typical year</th><th class="num">Predicted yield</th></tr></thead><tbody>`
                    + yearRow(years.driest.label, years.driest.response) + yearRow(years.median.label, years.median.response) + yearRow(years.wettest.label, years.wettest.response)
                    + `</tbody></table></div>`, true),
                card("crop-data", "Data behind it", `<div id="crop-data"><p>Training rows: ${esc(item.training_rows_for_crop)} of ${esc(item.training_rows_possible)}${incomplete}.</p>${barely}</div>`),
                card("crop-inputs", "Inputs used", `<dl id="crop-inputs" class="crop-facts stacked">${INPUT_KEYS.map(k =>
                    `<div><dt>${esc(NAMES[k])}</dt><dd>${fmt(response.inputs[k].value)} <em>(${esc(SOURCE_LABEL[response.inputs[k].source] || response.inputs[k].source)})</em></dd></div>`).join("")}</dl>`),
                card("crop-about", "About these numbers", `<p class="crop-caveat">${esc(response.model_caveat)}</p><p class="crop-absolute">${esc(response.absolute_yield_note)}</p>`, true),
            ].join("");

            const order = response.ranked_crops.map(c => c.crop);
            const at = order.indexOf(crop);
            const prev = order[(at - 1 + order.length) % order.length], next = order[(at + 1) % order.length];
            const used = Object.fromEntries(INPUT_KEYS.map(k => [k, response.inputs[k].value]));
            $("crop-prev").href = cropHref(prev, province, used);
            $("crop-prev").textContent = `Previous: ${prev}`;
            $("crop-next").href = cropHref(next, province, used);
            $("crop-next").textContent = `Next: ${next}`;
            $("crop-error").hidden = true;
            $("crop-content").hidden = false;
        }

        async function main() {
            try {
                const q = new URLSearchParams(window.location.search);
                const crop = (q.get("crop") || "").toLowerCase(), province = q.get("province") || "";
                if (!crop) throw new PageError("No crop in the address. Open a crop from the ranking on the predictor page.");
                const meta = await getJson("/api/v1/metadata");
                if (!meta.all_crops.includes(crop)) throw new PageError(`Unknown crop "${crop}". The model covers: ${meta.all_crops.join(", ")}.`);
                if (!meta.reference[province]) throw new PageError(`Unknown province "${province}". The model covers: ${Object.keys(meta.reference).join(", ")}.`);
                const inputs = {};
                for (const key of INPUT_KEYS) {
                    if (!q.has(key)) continue;
                    const value = Number(q.get(key));
                    if (q.get(key).trim() === "" || !Number.isFinite(value)) throw new PageError(`Input ${key} is not a number: "${q.get(key)}".`);
                    inputs[key] = value;
                }
                const run = scenario => getJson("/api/v1/recommend", { province, scenario_name: `${cap(crop)} in ${province}`, ...scenario });
                const real = kind => meta.scenarios.find(s => s.province === province && s.kind === kind);
                const [response, driest, median, wettest] = await Promise.all([
                    run(inputs), run(real("driest").inputs), run(meta.reference[province].median), run(real("wettest").inputs),
                ]);
                render(crop, province, inputs, response, {
                    driest: { label: `Driest real year (${real("driest").year})`, response: driest },
                    median: { label: "Typical (median) year", response: median },
                    wettest: { label: `Wettest real year (${real("wettest").year})`, response: wettest },
                });
            } catch (err) {
                console.error("Crop page", err);
                showError(err instanceof PageError ? err.message : "Cannot reach the model server, so no numbers are shown.");
            } finally {
                document.body.dataset.ready = "true";
            }
        }
        main();
    </script>
</body>
</html>
